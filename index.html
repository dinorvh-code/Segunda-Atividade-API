<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <div class="container">

        <div class="elementos">

        <div class="formulario">

            <h2 class="titulo">Busca de Endereço</h2>
            
            <div class="Busca">
                <input class="campo" type="text" id="campoBusca" placeholder="Digite o CEP..." maxlenght="9" inputmode="numeric">
                <button class="btn" class="" type="button" id="btnBuscar">Buscar</button>
            </div>

            </div>

            <div id="Resultado">
                <p class="CEP"><strong>CEP:</strong><span id="EndeCEP"></span></p>
                <p class="Logradouro"><strong>Logradouro:</strong><span id="EndeLogradouro"></span></p>
                <p class="Bairro"><strong>Bairro:</strong><span id="EndeBairro"></span></p>
                <p class="Cidade"><strong>Cidade:</strong><span id="EndeCidade"></span></p>
                <p class="Estado"><strong>Estado:</strong><span id="EndeEstado"></span></p>
            </div>

            <div id="msgErro" class="alerta">
                Endereço não encontrado. Tente novamente!
            </div>

        </div>

    </div>

</body>

</html>
